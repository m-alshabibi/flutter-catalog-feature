name: flutter_catalog_feature
description: "A reusable, production-ready Flutter catalog feature built with Clean Architecture and an offline-first approach."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.5


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  connectivity_plus: ^7.3.2
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  dio: ^5.11.1
  get_it: ^9.3.0
  flutter_bloc: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  http_mock_adapter: ^0.6.1



flutter:
  uses-material-design: true

